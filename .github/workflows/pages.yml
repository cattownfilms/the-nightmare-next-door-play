name: Publish verified gameplay
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download pinned public runtime package
        run: |
          python - <<'PY'
          import json,urllib.request
          c=json.load(open('release.json'))
          assert c['archiveURL'].startswith('https://github.com/cattownfilms/the-nightmare-next-door-play/releases/download/')
          urllib.request.urlretrieve(c['archiveURL'],'site.tar.gz')
          PY
      - run: python verify_package.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
